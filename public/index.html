<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>easyol</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/logo.png" alt="easyol" width="120" height="40">
      </div>

      <div class="source-box">
        <span>当前视图</span>
        <a id="sourceLink" href="#" target="_blank" rel="noreferrer">打开飞书表格</a>
      </div>

      <label class="search">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="频道、邮箱、状态、备注">
      </label>

      <div class="filter-group">
        <span>联系状态</span>
        <div id="statusFilters" class="status-filters"></div>
      </div>

      <div class="nav-actions">
        <a class="ghost-button" href="/setup.html" aria-label="设置" title="设置（修改飞书表格 / 邮箱等配置）">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>
        <button id="refreshBtn" class="ghost-button" type="button" aria-label="刷新飞书数据" title="刷新飞书数据">
          <svg class="refresh-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </aside>

    <section class="workspace">
      <div class="content-grid">
        <section class="kol-list">
          <div id="loadingState" class="empty-state">正在读取飞书数据...</div>
          <div id="cards" class="cards"></div>
        </section>

        <aside id="detailPanel" class="detail-panel">
          <div class="empty-detail">
            <h3>选择一个 KOL</h3>
            <p>点击左侧卡片后，会在这里显示表格字段状态和飞书邮件沟通记录。</p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
