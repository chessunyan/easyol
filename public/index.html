<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>easyol</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <path d="M509.493411 933.833421c180.149986-22.530133 247.704568-157.707858 270.224468-202.768123 22.518876-45.058219 22.518876-180.237991-22.5199-247.827365-45.037752-67.588351-157.630087-180.236967-337.780073-157.707858C239.26792 370.59034 104.155686 483.237933 81.63681 550.826284-8.437671 776.12454 284.305673 956.363554 509.493411 933.833421L509.493411 933.833421z" fill="#E9673F"></path>
            <path d="M959.866842 302.999942 757.19798 370.59034 802.236755 145.292084 644.605645 302.999942 577.047993 77.70271 464.455659 370.59034 577.047993 460.709847 712.160227 550.826284Z" fill="#00837F"></path>
          </svg>
        </span>
        <span class="brand-name">easyol</span>
      </div>

      <div class="source-box">
        <span>当前视图</span>
        <a id="sourceLink" href="#" target="_blank" rel="noreferrer">打开飞书表格</a>
      </div>

      <label class="search">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="频道、邮箱、状态、备注">
      </label>

      <div class="filter-group">
        <span>联系状态</span>
        <div id="statusFilters" class="status-filters"></div>
      </div>

      <button id="refreshBtn" class="ghost-button" type="button" aria-label="刷新飞书数据" title="刷新飞书数据">
        <svg class="refresh-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </aside>

    <section class="workspace">
      <div class="content-grid">
        <section class="kol-list">
          <div id="loadingState" class="empty-state">正在读取飞书数据...</div>
          <div id="cards" class="cards"></div>
        </section>

        <aside id="detailPanel" class="detail-panel">
          <div class="empty-detail">
            <h3>选择一个 KOL</h3>
            <p>点击左侧卡片后，会在这里显示表格字段状态和飞书邮件沟通记录。</p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
